name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Core tests
        run: swift test && swift test -c release
      - name: Release build
        run: xcodebuild -project 'Image Workshop.xcodeproj' -scheme 'Image Workshop' -configuration Release -destination 'platform=macOS' -derivedDataPath build build
      - name: Native workflow
        run: bash Scripts/test-ui.sh
      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/Workflow.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Workflow.xcresult --output-path build/Screenshots
          fi
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-workflow
          path: |
            build/Screenshots
            build/Workflow.xcresult
          if-no-files-found: ignore
